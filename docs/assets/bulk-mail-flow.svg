<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d"><title id="t">Current Bulk Mail data flow</title><desc id="d">Browser to Express to MongoDB and Gmail flow.</desc><rect width="1200" height="340" rx="24" fill="#0b1220"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="35" y="85" width="205" height="125" rx="16" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="137" y="130" font-size="22" fill="#fff">Browser</text><text x="137" y="163" font-size="15" fill="#bfdbfe">React + SheetJS</text><path d="M242 147h65m-15-12 15 12-15 12" stroke="#22d3ee" stroke-width="5" fill="none"/><rect x="315" y="85" width="205" height="125" rx="16" fill="#164e63" stroke="#22d3ee" stroke-width="2"/><text x="417" y="130" font-size="22" fill="#fff">Express API</text><text x="417" y="163" font-size="15" fill="#cffafe">POST /sendmail</text><path d="M522 147h65m-15-12 15 12-15 12" stroke="#22d3ee" stroke-width="5" fill="none"/><rect x="595" y="85" width="205" height="125" rx="16" fill="#365314" stroke="#a3e635" stroke-width="2"/><text x="697" y="130" font-size="22" fill="#fff">MongoDB</text><text x="697" y="163" font-size="15" fill="#ecfccb">Sender document</text><path d="M802 147h65m-15-12 15 12-15 12" stroke="#22d3ee" stroke-width="5" fill="none"/><rect x="875" y="85" width="285" height="125" rx="16" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/><text x="1017" y="130" font-size="22" fill="#fff">Nodemailer → Gmail</text><text x="1017" y="163" font-size="15" fill="#e0e7ff">Sequential send loop</text><text x="600" y="270" font-size="18" font-weight="700" fill="#fbbf24">⚠ No authentication · No rate limit · No consent gate · No unsubscribe</text><text x="600" y="305" font-size="14" fill="#94a3b8">Current implementation only. Not production architecture.</text></g></svg>